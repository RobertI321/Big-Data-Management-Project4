# Lab-only stack: Postgres + pgvector, MinIO (S3), Ollama (LLM).
# Subset of the production docker-compose at the repo root — no Airflow,
# because the notebook calls Postgres / MinIO / Ollama directly.
#
# Image versions are pinned for reproducibility, matching the production stack.

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "5"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "2"
    # Force the standard task runner to fresh-exec the worker subprocess
    # instead of fork()-ing. pyspark's Java gateway is unhappy with forked
    # state, surfacing as JAVA_GATEWAY_EXITED.
    AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "True"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    PYTHONPATH: /opt/airflow:/opt
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  volumes:
    - ./dags:/opt/airflow/dags
  user: "${AIRFLOW_UID:-50000}:0"

services:

  postgres:
    # PostgreSQL 16 LTS + pgvector 0.8 (HNSW + halfvec available).
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Migrations run alphabetically on first init (empty data dir).
      - ./config:/docker-entrypoint-initdb.d:ro # From configs folder
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Pinned RELEASE: MinIO ships breaking server/CLI changes on :latest.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console (browse buckets at http://localhost:9001)
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # Aligns mc client release with the server release above.
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} && mc mb --ignore-existing local/${MINIO_BUCKET} && echo 'minio bucket ready' "
    restart: "no"

  ollama:
    # Pinned API surface (/api/tags, /api/generate) — the notebook contract.
    image: ollama/ollama:0.5.4
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [ "CMD-SHELL", "ollama --version >/dev/null 2>&1 || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.5.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: >
      /bin/sh -c "ollama pull ${OLLAMA_MODEL} && echo 'ollama model ready'"
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint:
      - /bin/bash
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username airflow --password airflow \
          --firstname admin --lastname Bot \
          --role Admin --email admin@example.com || true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 1g

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "airflow jobs check --job-type SchedulerJob --limit 1 >/dev/null" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    # pyspark drivers run inside this container (see spark_engine.py); 1GB
    # cgroup was too tight for the JVM and Airflow worker to coexist.
    mem_limit: 2g

volumes:
  postgres-data:
  minio-data:
  ollama-data:
